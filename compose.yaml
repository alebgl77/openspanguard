name: openspanguard
services:
  openspanguard:
    build: .
    environment:
      OSG_HOST: 0.0.0.0
      OSG_PORT: '4318'
      OSG_EVALUATOR: demo
      OSG_DEMO_MODE: 'true'
      OSG_ALLOW_REMOTE_CONTENT: 'false'
      OSG_OTLP_ENDPOINT: http://collector:4318/v1/traces
      OSG_COHORTS: default,demo,canary
    ports:
      - 127.0.0.1:4318:4318
    depends_on:
      - collector
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 15s

  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./deploy/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4319:4318
      - 127.0.0.1:13133:13133
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.10.10
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001,mode=0770
    ports:
      - 127.0.0.1:3200:3200

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    depends_on:
      - openspanguard
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: [--config.file=/etc/alertmanager/alertmanager.yaml]
    volumes:
      - ./deploy/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports:
      - 127.0.0.1:9093:9093
    depends_on:
      - webhook

  webhook:
    image: node:22.23.2-alpine
    user: node
    working_dir: /app
    command: [node, receiver.mjs]
    volumes:
      - ./deploy/webhook/receiver.mjs:/app/receiver.mjs:ro
    ports:
      - 127.0.0.1:9080:9080
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
      - tempo

volumes:
  prometheus-data:
  grafana-data:
