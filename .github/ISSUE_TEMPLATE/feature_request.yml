name: Feature request
description: Describe a measured workflow gap.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and current workaround
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Compatibility, privacy and operating constraints
