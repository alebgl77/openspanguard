name: Bug report
description: Report a reproducible failure using synthetic data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, customer prompts or unsanitized traces. See SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: Version or commit and Node/Docker environment
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and sanitized configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
