name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo
      - run: npm run benchmark -- 20
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Check alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/work" -w /work prom/prometheus:v3.15.0 check rules alerts.yaml
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/work" -w /work prom/prometheus:v3.15.0 test rules alerts.test.yaml
      - name: Build and start local demo stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify metrics, trace, dashboard and local alert route
        run: node examples/stack-smoke.mjs
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop and remove demo volumes
        if: always()
        run: docker compose down -v --remove-orphans
